services:
  - type: web
    name: neuroscan-backend
    env: python
    buildCommand: "./build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: EFFICIENTNET_B4_URL
        sync: false
      - key: CONVNEXT_TINY_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
