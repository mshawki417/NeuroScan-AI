<!-- Shared Navbar - Stitch Design -->
<header class="h-16 px-10 flex items-center justify-between bg-white/80 backdrop-blur-md border-b border-slate-200 z-50 sticky top-0 shrink-0 shadow-sm">
  <!-- Logo -->
  <a routerLink="/" class="flex items-center gap-3 no-underline">
    <img alt="NeuroScan AI" class="h-9 w-9 object-contain rounded-xl shadow-sm" src="assets/logo.jpg">
    <div class="flex flex-col leading-none">
      <span class="font-bold text-base text-slate-900 tracking-tight">NeuroScan AI</span>
      <span class="text-[10px] text-slate-400 font-medium tracking-wider uppercase">Clinical Platform</span>
    </div>
  </a>

  <!-- Center Navigation -->
  <nav class="hidden md:flex items-center gap-1">
    <a routerLink="/upload"
       routerLinkActive="!bg-blue-50 !text-blue-700 !font-semibold"
       [routerLinkActiveOptions]="{exact:false}"
       class="flex items-center gap-2 px-4 py-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-all text-sm font-medium">
      <i class="ph ph-upload-simple"></i>
      <span>Upload Scan</span>
    </a>
    <a routerLink="/project"
       routerLinkActive="!bg-blue-50 !text-blue-700 !font-semibold"
       class="flex items-center gap-2 px-4 py-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-all text-sm font-medium">
      <i class="ph ph-folder-open"></i>
      <span>Project Details</span>
    </a>
    <a routerLink="/performance"
       routerLinkActive="!bg-blue-50 !text-blue-700 !font-semibold"
       class="flex items-center gap-2 px-4 py-2 rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-800 transition-all text-sm font-medium">
      <i class="ph ph-chart-line-up"></i>
      <span>Model Performance</span>
    </a>
  </nav>

  <!-- Right actions -->
  <div class="flex items-center gap-2">
    <div class="hidden md:flex items-center gap-1 mr-2">
      <span class="text-xs font-medium text-slate-400 font-mono">Model: EfficientNet-B4</span>
    </div>
    <button class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-full transition-all" title="Search">
      <i class="ph ph-magnifying-glass text-lg"></i>
    </button>
    <button class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-full transition-all relative" title="Notifications">
      <i class="ph ph-bell text-lg"></i>
      <span class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
    </button>
    <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white text-xs font-bold ml-1 border-2 border-blue-100">M</div>
  </div>
</header>
