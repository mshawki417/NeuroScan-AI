<section class="hero" id="hero" aria-label="Hero section">
  <div class="hero-zone">
    <div class="hero-inner">

      <div class="hero-left" data-aos="fade-up" data-aos-delay="0">
        <div class="hero-badge">
          <span class="badge-dot" aria-hidden="true"></span>
          <span>{{ 'hero_badge' | translate }}</span>
        </div>
        <h1 class="hero-headline">
          {{ 'hero_headline_1' | translate }}<br>
          <span class="headline-accent">{{ 'hero_headline_2' | translate }}</span>
        </h1>
        <p class="hero-subtext">{{ 'hero_sub' | translate }}</p>
        <div class="hero-cta">
          <button mat-raised-button class="btn-gold cta-primary" (click)="scrollTo('pricing')">
            <mat-icon>arrow_forward</mat-icon>
            {{ 'hero_cta_primary' | translate }}
          </button>
          <button mat-stroked-button class="cta-outline" (click)="scrollTo('features')">
            {{ 'hero_cta_outline' | translate }}
          </button>
        </div>
      </div>

      <div class="hero-image-wrap" data-aos="fade-left" data-aos-delay="150">
        <img src="assets/images/hero-construction.jpg"
             alt="Construction site with cranes and city skyline"
             class="hero-img" />
        <div class="img-fade-left"></div>
        <div class="img-fade-bottom"></div>
      </div>

    </div>
  </div>
</section>
