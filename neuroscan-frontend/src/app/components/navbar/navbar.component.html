<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/dashboard" class="logo">
      <!-- Medical DNA / Brain Logo -->
      <div class="logo-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer medical cross ring -->
          <circle cx="18" cy="18" r="17" stroke="#0e7490" stroke-width="1.5" fill="rgba(14,116,144,0.08)"/>
          <!-- Brain hemispheres -->
          <path d="M18 8 C13 8 9 11 9 15 C9 17.5 10.5 19.5 12.5 20.5 C11.5 21.5 11 22.8 11 24 C11 26.5 13 28 15.5 28 L18 28"
                fill="none" stroke="#0e7490" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M18 8 C23 8 27 11 27 15 C27 17.5 25.5 19.5 23.5 20.5 C24.5 21.5 25 22.8 25 24 C25 26.5 23 28 20.5 28 L18 28"
                fill="none" stroke="#22a3c4" stroke-width="1.6" stroke-linecap="round"/>
          <!-- Center divider -->
          <line x1="18" y1="8" x2="18" y2="28" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
          <!-- Neural nodes -->
          <circle cx="12.5" cy="15" r="2" fill="#0e7490"/>
          <circle cx="23.5" cy="15" r="2" fill="#22a3c4"/>
          <circle cx="18"   cy="20" r="2.5" fill="#38bdf8"/>
          <!-- Pulse dot -->
          <circle cx="18" cy="20" r="4" fill="none" stroke="#38bdf8" stroke-width="0.8" opacity="0.5"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="brand">NeuroScan</span>
        <span class="ai-tag">AI</span>
      </div>
    </a>
    <div class="logo-sub">AI-Powered Brain MRI Analysis</div>
  </div>

  <div class="nav-links">
    @for (lnk of links; track lnk.path) {
      <a [routerLink]="lnk.path" routerLinkActive="active" class="nav-link">{{ lnk.label }}</a>
    }
  </div>

  <div class="nav-right">
    <div class="search-box">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Search analyses..."/>
    </div>
    <a routerLink="/upload" class="btn btn-primary btn-sm">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Upload MRI Scan
    </a>
    <div class="avatar">M</div>
  </div>
</nav>
