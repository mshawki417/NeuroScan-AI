<section class="features" id="features" aria-label="Feature highlights">
  <div class="section-container">

    <div class="features-header" data-aos="fade-up">
      <span class="section-label">{{ 'feat_label' | translate }}</span>
      <h2 class="section-title">{{ 'feat_title' | translate }}</h2>
      <p class="section-subtitle">{{ 'feat_subtitle' | translate }}</p>
    </div>

    <div class="features-grid">
      <div class="feature-card" *ngFor="let f of features; let i = index"
           [attr.data-aos]="'fade-up'" [attr.data-aos-delay]="(i % 3) * 80">
        <div class="feat-icon" [class]="'feat-icon--' + f.color">
          <mat-icon>{{ f.icon }}</mat-icon>
        </div>
        <h3 class="feat-title">{{ f.titleKey | translate }}</h3>
        <p class="feat-desc">{{ f.descKey | translate }}</p>
        <a class="feat-link" role="button" tabindex="0">
          {{ 'feat_learn_more' | translate }}
          <mat-icon>arrow_forward</mat-icon>
        </a>
      </div>
    </div>

  </div>
</section>
