<nav class="navbar">
  <div class="nav-left">
    <a routerLink="/dashboard" class="logo">
      <div class="logo-icon">
        <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
          <circle cx="15" cy="15" r="14" stroke="#3b8ef0" stroke-width="1.5"/>
          <circle cx="15" cy="15" r="9"  fill="rgba(59,142,240,0.1)" stroke="#3b8ef0" stroke-width="1"/>
          <circle cx="15" cy="15" r="4"  fill="#22d3ee"/>
          <path d="M15 5 Q19 11 15 15 Q11 19 15 25" stroke="#22d3ee" stroke-width="1.3" fill="none"/>
          <path d="M5 15 Q11 11 15 15 Q19 19 25 15" stroke="#3b8ef0" stroke-width="1" fill="none" opacity=".6"/>
        </svg>
      </div>
      <div class="logo-text">
        <span class="brand">NeuroScan</span>
        <span class="ai-tag">AI</span>
      </div>
    </a>
    <div class="logo-sub">AI-Powered Brain MRI Analysis</div>
  </div>

  <div class="nav-links">
    @for (lnk of links; track lnk.path) {
      <a [routerLink]="lnk.path" routerLinkActive="active" class="nav-link">{{ lnk.label }}</a>
    }
  </div>

  <div class="nav-right">
    <div class="search-box">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input type="text" placeholder="Search analyses..."/>
    </div>
    <a routerLink="/upload" class="btn btn-primary btn-sm">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      Upload MRI Scan
    </a>
    <div class="avatar">M</div>
  </div>
</nav>
